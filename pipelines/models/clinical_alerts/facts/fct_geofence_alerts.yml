version: 2

models:
  - name: fct_geofence_alerts
    description: "Alerts fired when a patient device breaches their assigned care area geofence"
    columns:
      - name: event_id
        data_type: string
        constraints:
          - type: not_null
      - name: patient_id
        data_type: string
      - name: device_id
        data_type: string
      - name: current_lat
        data_type: double
      - name: current_lng
        data_type: double
      - name: care_area_id
        data_type: string
      - name: center_lat
        data_type: double
      - name: center_lng
        data_type: double
      - name: radius_meters
        data_type: double
      - name: event_ts
        data_type: timestamp_ltz(3)
