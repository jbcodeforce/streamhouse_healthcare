version: 2

models:
  - name: src_devices
    description: "Flattened CDC source stream for medical IoT devices"
    columns:
      - name: device_id
        data_type: string
        constraints:
          - type: not_null
      - name: model_id
        data_type: string
      - name: serial_number
        data_type: string
      - name: firmware_version
        data_type: string
      - name: battery_pct
        data_type: int
      - name: status
        data_type: string
      - name: event_ts
        data_type: timestamp_ltz(3)
