version: 2

models:
  - name: src_device_assignments
    description: "Flattened CDC source stream for patient device and bed assignments"
    columns:
      - name: assignment_id
        data_type: string
        constraints:
          - type: not_null
      - name: patient_id
        data_type: string
      - name: device_id
        data_type: string
      - name: care_area_id
        data_type: string
      - name: bed_label
        data_type: string
      - name: status
        data_type: string
      - name: event_ts
        data_type: timestamp_ltz(3)
